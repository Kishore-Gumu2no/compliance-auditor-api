# Fully pinned dependency set for the backend image -- a lock file, not a
# wish list. Generated with `pip freeze` from the .venv that produced the
# measurements in BENCHMARKS.md, so this is a combination known to work
# together rather than one a resolver guessed at.
#
# Why this exists: requirements.txt named packages without versions, leaving
# pip's resolver an open search space. Building the image from it sent pip
# backtracking from openai 3.16 down to 3.3 hunting for a compatible set, on a
# connection that drops roughly one request in five. Two builds failed and a
# third was cancelled at 23 minutes. Pinned, there is exactly one candidate per
# package and nothing to backtrack over.
#
# en_core_web_lg is pinned here deliberately. Presidio's AnalyzerEngine()
# needs it, and when it is absent Presidio downloads 400 MB at RUNTIME on the
# first mask_pii() call -- verified against the previous image, which did not
# contain it. Installing it at build time trades image size for not doing that
# download during a demo.
#
# Regenerate after changing requirements.txt:
#     pip install -r requirements.txt && pip freeze > requirements.lock
#   then delete the Windows-only lines listed below.
#
# Dropped as Windows-only (no Linux wheel exists, so a pin would fail):
#     pywin32==312
#     win32_setctime==1.2.0

