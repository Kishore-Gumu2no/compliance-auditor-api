    - generic [ref=f3e168]:
      - generic [ref=f3e169]: PRIVACY
      - heading "Your Privacy is Non-Negotiable" [level=2] [ref=f3e170]
      - generic [ref=f3e171]:
        - generic [ref=f3e172]:
          - generic [ref=f3e173]: 🔒
          - heading "PII Redaction" [level=3] [ref=f3e174]
          - paragraph [ref=f3e175]: All personal identifiers — names, phone numbers, email addresses, Aadhaar, PAN — are automatically detected and masked before any AI processing.
        - generic [ref=f3e176]:
          - generic [ref=f3e177]: 🚫
          - heading "No Data Storage" [level=3] [ref=f3e178]
          - paragraph [ref=f3e179]: Documents you send through Telegram are deleted as soon as the audit finishes. The trips read from them — their times and amounts — are deleted too, as soon as you have been shown your result.
        - generic [ref=f3e180]:
          - generic [ref=f3e181]: 🔐
          - heading "Zero-Trust Architecture" [level=3] [ref=f3e182]
          - paragraph [ref=f3e183]: Names, phone numbers and other personal details are blacked out before the AI ever sees a document. FairPay keeps your partner ID with your result, so it knows whose result to show you.
        - generic [ref=f3e184]:
          - generic [ref=f3e185]: 📜
          - heading "Audit Transparency" [level=3] [ref=f3e186]
          - paragraph [ref=f3e187]: Every audit generates an immutable SHA-256 receipt hash. You can verify the integrity of your audit at any time.
      - paragraph [ref=f3e189]:
        - strong [ref=f3e190]: FairPay Engine does not store your personal details.
        - text: What is kept is your result — the amounts worked out, whether the conditions were met, and the receipt — stored under your partner ID so it can be shown back to you. FairPay also remembers which Telegram chat that ID belongs to; send
        - strong [ref=f3e191]: /unlink
        - text: to the bot and it forgets the chat and your past results.
